# CodePilot 配置文件示例
# 将此文件复制为 config.yaml 并填入真实密钥

providers:
  - name: "Claude Sonnet"
    protocol: anthropic            # 协议类型：anthropic 或 openai
    model: claude-sonnet-4-6       # 模型 ID
    base_url: https://api.anthropic.com
    api_key: sk-ant-your-key-here
    thinking: true                 # 是否启用扩展思考（仅 anthropic 协议有效）

  - name: "GPT via OpenAI"
    protocol: openai
    model: gpt-4o
    base_url: https://api.openai.com
    api_key: sk-your-key-here
    # thinking 字段可省略，默认 false

# Agent 循环配置（可选，缺省用默认值）
agent:
  max_rounds: 10              # 单条消息的迭代上限（安全网）
  max_unknown: 2              # 连续调用未知工具几次后停止
  prompt_refresh_every: 3     # 规划模式指令每 N 轮精简重复一次（第 1 轮注入全文）

# 日志落盘配置（可选，file 留空则不写盘；可用 MEWCODE_LOG 环境变量覆盖）
log:
  file: logs/codepilot.log    # 相对路径，将在启动时自动创建
  level: INFO                 # DEBUG / INFO / WARNING

# 权限系统配置（可选；规则优先级 deny > ask > allow，与写入层级无关）
permissions:
  mode: default               # strict / default / permissive（无规则命中时的兜底）
  # 三级规则文件；留空则用默认路径（用户级 ~/.config/codepilot/permissions.yaml，
  # 项目级 ./codepilot-permissions.yaml，本地级 ./codepilot-permissions.local.yaml）
  # 规则格式：Tool(pattern): allow|ask|deny，如 run(git *): allow

# 会话恢复配置（可选；state12）
session:
  auto_resume: false          # 默认=新会话；设 true 则裸启动自动接最近会话。
                              # 显式 -c/--resume 始终接最近，不受此开关影响。
  gap_hours: 24               # 距上次会话超多少小时,恢复时插入时间跨度提醒(0=关闭)
  max_age_days: 30            # 更早的会话在启动时被自动清理
