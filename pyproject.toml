[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot"
version = "0.2.0"
description = "CodePilot — CLI AI coding agent with tool system"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
codepilot = "codepilot.main:main"

[tool.setuptools.packages.find]
include = ["codepilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
